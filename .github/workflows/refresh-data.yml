name: Refresh Data & Reports

# 【为什么不每天跑】
#   全量抓取 OpenAlex 需要约 21 分钟、下载约 74 MB。
#   每天跑一次是纯粹的浪费，而且会给上游 API 制造无谓的负载 ——
#   这是数据伦理问题，不只是成本问题。
#
#   所以这里是**每周一次 + 手动触发**：
#     - Retraction Watch 每个工作日更新，但周级频率对分析结论毫无影响
#     - OpenAlex 的撤稿标记变化更慢
#   需要最新数据时，手动点一下 "Run workflow" 即可。
on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full_refetch:
        description: "是否重新全量抓取 OpenAlex（勾选则耗时约 21 分钟）"
        type: boolean
        default: false

permissions:
  contents: write   # 需要写权限才能把更新后的报告提交回仓库

jobs:
  refresh:
    name: 刷新数据与报告
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-build-isolation

      - name: 配置联系邮箱
        # 邮箱从 GitHub Secrets 读取，**不写进代码库**。
        # 这是"配置与代码分离"最基本的一条：把个人信息提交上去之后，
        # 即使后来删掉，Git 历史里依然留有记录。
        env:
          PMH_CONTACT_EMAIL: ${{ secrets.PMH_CONTACT_EMAIL }}
        run: |
          if [ -z "$PMH_CONTACT_EMAIL" ]; then
            echo "::warning::未配置 PMH_CONTACT_EMAIL secret，将无法进入礼貌池，可能遭遇更严格的限流"
            echo "PMH_CONTACT_EMAIL=ci@example.com" > .env
          else
            echo "PMH_CONTACT_EMAIL=$PMH_CONTACT_EMAIL" > .env
          fi
          echo "PMH_HTTP_TRUST_ENV=false" >> .env
          echo "PMH_LOG_LEVEL=INFO" >> .env

      - name: 缓存 OpenAlex 原始数据
        # OpenAlex 的原始分页文件带日期无关的内容，可以跨运行复用。
        # 只有显式要求 full_refetch 时才重新抓取。
        if: ${{ github.event.inputs.full_refetch != 'true' }}
        uses: actions/cache@v4
        with:
          path: data/raw/openalex
          key: openalex-raw-${{ github.run_id }}
          restore-keys: |
            openalex-raw-

      - name: 运行完整流水线
        run: |
          if [ "${{ github.event.inputs.full_refetch }}" = "true" ]; then
            python scripts/00_run_all.py
          else
            python scripts/00_run_all.py --skip-fetch
          fi

      - name: 上传数据仓库与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papermill-hunter-reports
          path: |
            reports/
            data/warehouse.duckdb
          if-no-files-found: warn
          retention-days: 30

      - name: 提交更新后的报告
        # 把重新生成的图表和报告提交回仓库，让 README 里的图始终是最新的。
        # 用 [skip ci] 避免这个提交再次触发 CI，形成无限循环。
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "报告无变化，跳过提交。"
          else
            git commit -m "chore: 自动刷新分析报告与图表 [skip ci]"
            git push
          fi
